<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Areca Palm Tree -->
  <g>
    <!-- Tree Trunk -->
    <rect x="28" y="35" width="8" height="25" fill="#8B4513" rx="2"/>
    <rect x="29" y="36" width="6" height="23" fill="#A0522D" rx="1"/>
    
    <!-- Palm Fronds -->
    <g transform="translate(32,35)">
      <!-- Frond 1 -->
      <path d="M0,0 Q-15,-8 -25,-5 Q-20,-3 -12,-2 Q-8,-1 0,0" fill="#228B22"/>
      <!-- Frond 2 -->
      <path d="M0,0 Q-8,-15 -5,-25 Q-3,-20 -2,-12 Q-1,-8 0,0" fill="#32CD32"/>
      <!-- Frond 3 -->
      <path d="M0,0 Q8,-15 5,-25 Q3,-20 2,-12 Q1,-8 0,0" fill="#228B22"/>
      <!-- Frond 4 -->
      <path d="M0,0 Q15,-8 25,-5 Q20,-3 12,-2 Q8,-1 0,0" fill="#32CD32"/>
      <!-- Frond 5 -->
      <path d="M0,0 Q12,-12 20,-15 Q15,-10 8,-8 Q4,-6 0,0" fill="#228B22"/>
      <!-- Frond 6 -->
      <path d="M0,0 Q-12,-12 -20,-15 Q-15,-10 -8,-8 Q-4,-6 0,0" fill="#32CD32"/>
    </g>
    
    <!-- Areca Nut Cluster -->
    <g transform="translate(32,30)">
      <!-- Main cluster background -->
      <ellipse cx="0" cy="0" rx="8" ry="6" fill="#FF8C00"/>
      
      <!-- Individual areca nuts -->
      <circle cx="-4" cy="-2" r="1.5" fill="#FFB347"/>
      <circle cx="-2" cy="-3" r="1.5" fill="#FF8C00"/>
      <circle cx="0" cy="-3" r="1.5" fill="#FFB347"/>
      <circle cx="2" cy="-3" r="1.5" fill="#FF8C00"/>
      <circle cx="4" cy="-2" r="1.5" fill="#FFB347"/>
      
      <circle cx="-5" cy="0" r="1.5" fill="#FF8C00"/>
      <circle cx="-3" cy="-1" r="1.5" fill="#FFB347"/>
      <circle cx="-1" cy="-1" r="1.5" fill="#FF8C00"/>
      <circle cx="1" cy="-1" r="1.5" fill="#FFB347"/>
      <circle cx="3" cy="-1" r="1.5" fill="#FF8C00"/>
      <circle cx="5" cy="0" r="1.5" fill="#FFB347"/>
      
      <circle cx="-4" cy="1" r="1.5" fill="#FFB347"/>
      <circle cx="-2" cy="1" r="1.5" fill="#FF8C00"/>
      <circle cx="0" cy="1" r="1.5" fill="#FFB347"/>
      <circle cx="2" cy="1" r="1.5" fill="#FF8C00"/>
      <circle cx="4" cy="1" r="1.5" fill="#FFB347"/>
      
      <circle cx="-3" cy="3" r="1.5" fill="#FF8C00"/>
      <circle cx="-1" cy="3" r="1.5" fill="#FFB347"/>
      <circle cx="1" cy="3" r="1.5" fill="#FF8C00"/>
      <circle cx="3" cy="3" r="1.5" fill="#FFB347"/>
    </g>
    
    <!-- Dried Areca Nuts (bottom right) -->
    <g transform="translate(45,45)">
      <circle cx="0" cy="0" r="3" fill="#8B4513"/>
      <circle cx="4" cy="1" r="2.5" fill="#A0522D"/>
      <circle cx="2" cy="4" r="2.5" fill="#8B4513"/>
      <circle cx="6" cy="4" r="2" fill="#A0522D"/>
      <circle cx="1" cy="7" r="2" fill="#8B4513"/>
      <circle cx="5" cy="7" r="2" fill="#A0522D"/>
      
      <!-- Nut texture lines -->
      <line x1="-1" y1="-1" x2="1" y2="1" stroke="#654321" stroke-width="0.5"/>
      <line x1="3" y1="0" x2="5" y2="2" stroke="#654321" stroke-width="0.5"/>
      <line x1="1" y1="3" x2="3" y2="5" stroke="#654321" stroke-width="0.5"/>
    </g>
  </g>
</svg>