<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="32" cy="32" r="30" fill="#f0f9ff" stroke="#e0f2fe" stroke-width="2"/>
  
  <!-- Person figure -->
  <!-- Head -->
  <circle cx="32" cy="18" r="4" fill="#8b5a3c"/>
  
  <!-- Body -->
  <rect x="28" y="22" width="8" height="12" rx="2" fill="#3b82f6"/>
  
  <!-- Arms -->
  <rect x="24" y="24" width="3" height="8" rx="1.5" fill="#8b5a3c"/>
  <rect x="37" y="24" width="3" height="8" rx="1.5" fill="#8b5a3c"/>
  
  <!-- Legs -->
  <rect x="29" y="34" width="3" height="10" rx="1.5" fill="#6b7280"/>
  <rect x="32" y="34" width="3" height="10" rx="1.5" fill="#6b7280"/>
  
  <!-- Backpack sprayer tank -->
  <rect x="35" y="20" width="8" height="16" rx="2" fill="#ff6b35"/>
  <rect x="36" y="21" width="6" height="2" rx="1" fill="#dc2626"/>
  
  <!-- Tank straps -->
  <path d="M35 22 Q32 24 32 26" stroke="#374151" stroke-width="1.5" fill="none"/>
  <path d="M35 30 Q32 32 32 34" stroke="#374151" stroke-width="1.5" fill="none"/>
  
  <!-- Spray wand/lance -->
  <line x1="27" y1="30" x2="18" y2="38" stroke="#374151" stroke-width="2"/>
  <circle cx="18" cy="38" r="1.5" fill="#6b7280"/>
  
  <!-- Spray particles -->
  <circle cx="16" cy="40" r="1" fill="#22c55e" opacity="0.8"/>
  <circle cx="14" cy="42" r="0.8" fill="#22c55e" opacity="0.6"/>
  <circle cx="12" cy="44" r="0.6" fill="#22c55e" opacity="0.4"/>
  <circle cx="15" cy="43" r="0.7" fill="#22c55e" opacity="0.5"/>
  <circle cx="13" cy="41" r="0.5" fill="#22c55e" opacity="0.3"/>
  
  <!-- Hose connection -->
  <path d="M39 32 Q42 34 44 36" stroke="#1f2937" stroke-width="2" fill="none"/>
  <path d="M44 36 Q30 40 27 30" stroke="#1f2937" stroke-width="1.5" fill="none"/>
  
  <!-- Small plants being sprayed -->
  <path d="M10 48 Q12 46 14 48 Q16 46 18 48" stroke="#16a34a" stroke-width="1.5" fill="none"/>
  <path d="M8 50 Q10 48 12 50 Q14 48 16 50" stroke="#16a34a" stroke-width="1.5" fill="none"/>
</svg>